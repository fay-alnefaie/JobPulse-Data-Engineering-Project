version: 2

models:
  - name: dim_skills
    description: "Dimension table containing unique extracted skills."
    columns:
      - name: skill_key
        tests:
          - not_null
          - unique

      - name: skill_name
        tests:
          - not_null

      - name: skill_category
        tests:
          - not_null

  - name: bridge_job_skills
    description: "Bridge table connecting jobs with extracted skills."
    columns:
      - name: job_key
        tests:
          - not_null

      - name: skill_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_skills')
                field: skill_key

      - name: confidence
        tests:
          - not_null